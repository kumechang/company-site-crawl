name: crawl

# 手動実行のみ。企業の収集→補完→検証→CSV出力を GitHub Actions 上で回す（コンテナの再起動で途切れないように）。
# 事前に Settings → Secrets and variables → Actions に EDINET_API_KEY を登録する。
# 収集データ(companies.json・progress.json・robots記録)は 15 分ごとに専用ブランチ crawl-data へ退避され、次回の実行はそこから続きを処理する。
# 実行したブランチ(main等)には書き込まない（他のコミットと衝突しないように）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample=収集から検証まで全部 / employees=従業員数だけが不足している会社の従業員数だけを取りに行く（サンプルを早く完成させる用）'
        type: choice
        options: [sample, employees]
        default: sample
      categories:
        description: 'カテゴリ(カンマ区切り): cosme_d2c,influencer_agency,ad_agency,sns_agency'
        default: 'influencer_agency,cosme_d2c'
      ok:
        description: 'カテゴリごとの検証OK目標件数'
        default: '12'
      enrich_limit:
        description: '1回の補完で巡回する会社数の上限(0=無制限)'
        default: '30'
      skip:
        description: '補完で飛ばす情報源(salesnow,prtimes,gbizinfo,mynavi,careertasu,openwork)'
        default: 'openwork,salesnow'

concurrency:
  group: crawl-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      CHROME_PATH: /usr/bin/google-chrome
      NO_SANDBOX: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: crawl (sample)
        run: |
          scripts/ci-crawl.sh "${{ inputs.mode }} --ok ${{ inputs.ok }} --categories ${{ inputs.categories }} --enrich-limit ${{ inputs.enrich_limit }} --skip ${{ inputs.skip }}"
      - name: verify and export
        if: always()
        run: node src/cli.js verify --categories ${{ inputs.categories }} && node src/cli.js export --ok ${{ inputs.ok }} --categories ${{ inputs.categories }}
      - name: save data
        if: always()
        run: |
          source scripts/ci-data.sh
          data_snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csv
          path: |
            data/sample.csv
            data/sample_review.csv
            data/review_queue.csv
            data/companies.csv
          if-no-files-found: warn
